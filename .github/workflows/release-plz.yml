name: Release-plz

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'hencjo' }}
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect release for this commit
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="silo-v$version"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No GitHub release named $tag exists; skipping artifact build."
            exit 0
          fi

          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"

          if [[ "$(git rev-list -n1 "$tag")" != "$(git rev-parse HEAD)" ]]; then
            echo "Release $tag does not point at this commit; skipping artifact build."
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-artifacts:
    name: Release artifacts
    needs: release-plz-release
    if: ${{ github.repository_owner == 'hencjo' && needs.release-plz-release.outputs.tag != '' }}
    uses: ./.github/workflows/release-artifacts.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'hencjo' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
