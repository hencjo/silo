name: Release-plz

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'hencjo' }}
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        id: release_plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select release for artifact build
        id: released
        if: ${{ steps.release_plz.outputs.releases_created == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="silo-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-artifacts:
    name: Release artifacts
    needs: release-plz-release
    if: ${{ github.repository_owner == 'hencjo' && needs.release-plz-release.outputs.tag != '' }}
    uses: ./.github/workflows/release-artifacts.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'hencjo' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
